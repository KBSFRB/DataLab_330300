<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Municipality Explorer</title>

        <!-- Observable Plot and D3 -->
        <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
        <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6"></script>

        <!-- Alpine.js -->
        <script
            defer
            src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.3/cdn.min.js"
        ></script>
        <script src="scripts/utils.js"></script>
        <script src="scripts/explorer.js"></script>

        <link rel="stylesheet" href="style/reset.css" />
        <link rel="stylesheet" href="style/explorer.css" />
    </head>
    <body>
        <div x-data="explorerApp()" x-init="init()">
            <header>
                <h1>3-30-300 Explorer</h1>
            </header>

            <main class="main-container">
                <!-- Loading indicator -->
                <section x-show="isLoading" class="loading">
                    <p>Loading data...</p>
                </section>

                <!-- Error message -->
                <section x-show="error" class="error">
                    <p x-text="error"></p>
                </section>

                <!-- Search Bar with Datalist -->
                <section class="controls" x-show="!isLoading">
                    <input
                        type="search"
                        x-model="searchTerm"
                        @input="handleSearchInput()"
                        placeholder="Search places..."
                        aria-label="Search"
                        list="search-results"
                        autocomplete="off"
                    />
                    <datalist id="search-results">
                        <template x-for="item in searchResults" :key="item.nis">
                            <option
                                :value="getSearchDisplayName(item)"
                                x-text="getSearchDisplayName(item)"
                            ></option>
                        </template>
                    </datalist>
                </section>

                <!-- Breadcrumbs -->
                <section
                    x-show="!isLoading && breadcrumbs.length > 0"
                    class="breadcrumbs"
                >
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb-list">
                            <template
                                x-for="(crumb, index) in breadcrumbs"
                                :key="crumb.nis"
                            >
                                <li class="breadcrumb-item">
                                    <a
                                        x-show="crumb.isClickable"
                                        :href="'?v=' + crumb.viewName"
                                        x-text="crumb.name"
                                        class="breadcrumb-link"
                                    ></a>
                                    <span
                                        x-show="!crumb.isClickable"
                                        x-text="crumb.name"
                                        class="breadcrumb-current"
                                    ></span>
                                    <span
                                        x-show="index < breadcrumbs.length - 1"
                                        class="breadcrumb-separator"
                                        aria-hidden="true"
                                        >></span
                                    >
                                </li>
                            </template>
                        </ol>
                    </nav>
                </section>

                <!-- Current level title -->
                <section x-show="!isLoading && metadata" class="level-title">
                    <h2>
                        <span x-text="currentLevelName"></span>
                        <span x-show="parentName">
                            in <span x-text="parentName"></span>
                        </span>
                    </h2>
                </section>

                <!-- Map and Chart Container -->
                <section class="viz-container" x-show="!isLoading">
                    <!-- Map -->
                    <div class="map-section">
                        <div id="map-container"></div>
                        <div
                            x-show="chartXAxis && getLegendData()"
                            class="color-legend"
                        >
                            <div
                                class="legend-title"
                                x-text="getLegendData()?.label"
                            ></div>
                            <div class="legend-color-bar">
                                <template
                                    x-for="(color, index) in getLegendData()?.colors"
                                    :key="index"
                                >
                                    <div
                                        class="legend-color-segment"
                                        :style="{ backgroundColor: color }"
                                    ></div>
                                </template>
                            </div>
                            <div class="legend-labels">
                                <template
                                    x-for="(grade, index) in getLegendData()?.grades"
                                    :key="index"
                                >
                                    <span
                                        class="legend-label"
                                        :style="{ left: (grade * 100) + '%' }"
                                        x-text="formatLegendValue(getLegendData().range[0] + (getLegendData().range[1] - getLegendData().range[0]) * grade)"
                                    ></span>
                                </template>
                            </div>
                        </div>
                        <p x-show="metadata?.zoomable" class="map-hint">
                            Click on a region to zoom in
                        </p>
                    </div>

                    <!-- Chart (only show when metadata indicates) -->
                    <div x-show="showChart" class="chart-section">
                        <div id="chart-container"></div>

                        <!-- Chart Controls -->
                        <form class="chart-controls">
                            <label>
                                X-axis:
                                <select
                                    x-model="chartXAxis"
                                    @change="updateChart()"
                                >
                                    <template
                                        x-for="indicator in availableXAxisOptions"
                                        :key="indicator.id"
                                    >
                                        <option
                                            :value="indicator.id"
                                            x-text="indicator.name"
                                        ></option>
                                    </template>
                                </select>
                            </label>

                            <label>
                                Y-axis:
                                <select
                                    x-model="chartYAxis"
                                    @change="updateChart()"
                                >
                                    <template
                                        x-for="indicator in availableYAxisOptions"
                                        :key="indicator.id"
                                    >
                                        <option
                                            :value="indicator.id"
                                            x-text="indicator.name"
                                        ></option>
                                    </template>
                                </select>
                            </label>
                        </form>
                    </div>
                </section>

                <!-- Data Table -->
                <section x-show="showTable" class="table-section">
                    <h3>
                        Data for <span x-text="currentLevelName"></span>
                        <span x-show="parentName">
                            in <span x-text="parentName"></span>
                        </span>
                    </h3>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <template
                                        x-for="column in tableColumns"
                                        :key="column.id"
                                    >
                                        <th
                                            @click="column.sortable && sortTable(column.id)"
                                            :class="{
                                                'sortable': column.sortable,
                                                'sorted-asc': sortField === column.id && sortDirection === 'asc',
                                                'sorted-desc': sortField === column.id && sortDirection === 'desc'
                                            }"
                                        >
                                            <span x-text="column.name"></span>
                                            <span
                                                x-show="sortField === column.id"
                                                x-text="sortDirection === 'asc' ? '↑' : '↓'"
                                                class="sort-indicator"
                                            ></span>
                                        </th>
                                    </template>
                                </tr>
                            </thead>
                            <tbody>
                                <template
                                    x-for="feature in sortedFeatures"
                                    :key="feature.properties.nis || feature.properties.id"
                                >
                                    <tr>
                                        <template
                                            x-for="column in tableColumns"
                                            :key="column.id"
                                        >
                                            <td
                                                :style="{
                                                    backgroundColor: getTableCellBackgroundColor(feature, column.id),
                                                    color: getTableCellTextColor(feature, column.id)
                                                }"
                                            >
                                                <span
                                                    x-text="column.id === 'name'
                                                        ? (feature.properties.name_en || feature.properties.nis)
                                                        : formatValue(feature.properties[column.id], column.id)"
                                                ></span>
                                            </td>
                                        </template>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- Empty state -->
                <section
                    x-show="!isLoading && !error && features.length === 0"
                    class="empty-state"
                >
                    <p>No data available for this level.</p>
                </section>
            </main>
        </div>
    </body>
</html>
